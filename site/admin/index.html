<title>Update the website · Baked on 8th</title>

<body>
<!-- Decap CMS (free, open source): a form-based editor for the files in site/content/. See content/README.md. -->
<script>
  // Jumping straight from one entry to another (a pasted link, the back button) can show the new entry with the
  // previous entry's empty fields. Reload on those jumps so every entry opens with its own saved content.
  (function () {
    var entry = function (h) { return /^#\/collections\/[^/]+\/entries\//.test(h || ''); };
    var last = location.hash;
    addEventListener('hashchange', function () {
      if (entry(last) && entry(location.hash) && last !== location.hash) location.reload();
      last = location.hash;
    });
  })();
</script>
<!-- integrity: the browser refuses the editor if unpkg ever serves a changed file. Update the hash with the version. -->
<script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js" integrity="sha384-A/Gdn928CNLufmnGWGs9RM4Q9o8bSNLeJERqBFrBjwzL7FRpoLT3MPF8Tl0+Wd2p" crossorigin="anonymous"></script>
</body>
</html>
